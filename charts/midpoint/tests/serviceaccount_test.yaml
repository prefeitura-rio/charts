suite: test midpoint serviceaccount
templates:
  - serviceaccount.yaml
values:
  - ../values.yaml
tests:
  - it: should create a service account by default
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: RELEASE-NAME-midpoint

  - it: should not create a service account when create is false
    set:
      serviceAccount.create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should use a custom name when specified
    set:
      serviceAccount.name: custom-midpoint-sa
    asserts:
      - equal:
          path: metadata.name
          value: custom-midpoint-sa

  - it: should set annotations when specified
    set:
      serviceAccount.annotations:
        iam.gke.io/gcp-service-account: cloudsql-proxy@project.iam.gserviceaccount.com
    asserts:
      - equal:
          path: metadata.annotations["iam.gke.io/gcp-service-account"]
          value: cloudsql-proxy@project.iam.gserviceaccount.com
