suite: test midpoint secrets
templates:
  - secret.yaml
values:
  - ../values.yaml
tests:
  - it: should create db and admin secrets by default
    asserts:
      - hasDocuments:
          count: 2

  - it: should create the database secret with the configured username
    set:
      database.username: midpoint
      database.password: dbpass
    documentIndex: 0
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-midpoint-db
      - equal:
          path: stringData.username
          value: midpoint
      - equal:
          path: stringData.password
          value: dbpass

  - it: should create the admin secret with the configured username
    set:
      admin.username: administrator
      admin.password: adminpass
    documentIndex: 1
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-midpoint-admin
      - equal:
          path: stringData.username
          value: administrator
      - equal:
          path: stringData.password
          value: adminpass

  - it: should not create the database secret when existingSecret is set
    set:
      database.existingSecret: my-db-secret
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-midpoint-admin

  - it: should not create any secret when both existingSecret values are set
    set:
      database.existingSecret: my-db-secret
      admin.existingSecret: my-admin-secret
    asserts:
      - hasDocuments:
          count: 0
