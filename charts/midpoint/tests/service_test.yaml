suite: test midpoint service
templates:
  - service.yaml
values:
  - ../values.yaml
tests:
  - it: should render service with defaults
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: RELEASE-NAME-midpoint
      - equal:
          path: spec.type
          value: ClusterIP
      - equal:
          path: spec.ports[0].port
          value: 8080
      - equal:
          path: spec.ports[0].targetPort
          value: gui

  - it: should use a custom port when specified
    set:
      service.port: 9090
    asserts:
      - equal:
          path: spec.ports[0].port
          value: 9090

  - it: should set annotations when specified
    set:
      service.annotations:
        foo: bar
    asserts:
      - equal:
          path: metadata.annotations.foo
          value: bar
