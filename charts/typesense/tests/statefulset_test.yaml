suite: test typesense statefulset
templates:
  - statefulset.yaml
tests:
  - it: should render statefulset with default values
    asserts:
      - isKind:
          of: StatefulSet
      - equal:
          path: metadata.name
          value: RELEASE-NAME-typesense
      - equal:
          path: spec.replicas
          value: 3

  - it: should use custom replicas when specified
    set:
      replicas: 5
    asserts:
      - equal:
          path: spec.replicas
          value: 5

  - it: should use correct image
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "docker.io/typesense/typesense:30.1"

  - it: should use custom image tag when specified
    set:
      image.tag: "30.0"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "docker.io/typesense/typesense:30.0"

  - it: should mount persistence volume when enabled
    set:
      persistence.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: data
            mountPath: /data

  - it: should have volumeClaimTemplates when persistence enabled
    set:
      persistence.enabled: true
    asserts:
      - isNotEmpty:
          path: spec.volumeClaimTemplates

  - it: should use default PVC size
    set:
      persistence.enabled: true
    asserts:
      - equal:
          path: spec.volumeClaimTemplates[0].spec.resources.requests.storage
          value: 25Gi

  - it: should have TYPESENSE_DATA_DIR env variable
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TYPESENSE_DATA_DIR
            value: /data

  - it: should set resources when specified
    set:
      resources:
        requests:
          cpu: 500m
          memory: 1Gi
        limits:
          cpu: 2
          memory: 4Gi
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 500m
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 4Gi

  - it: should pass the literal apiKey in env and args when apiKeySecret is not set
    set:
      apiKey: test-literal-key
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TYPESENSE_API_KEY
            value: test-literal-key
      - contains:
          path: spec.template.spec.containers[0].args
          content: test-literal-key
      - notContains:
          path: spec.template.spec.containers[0].args
          content: $(TYPESENSE_API_KEY)
      - equal:
          path: spec.template.spec.containers[0].args[3]
          value: test-literal-key

  - it: should read the api key from an existing Secret when apiKeySecret.name is set
    set:
      apiKey: test-literal-key
      apiKeySecret:
        name: typesense-api-key
        key: token
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TYPESENSE_API_KEY
            valueFrom:
              secretKeyRef:
                name: typesense-api-key
                key: token
      - equal:
          path: spec.template.spec.containers[0].args[2]
          value: --api-key
      - equal:
          path: spec.template.spec.containers[0].args[3]
          value: $(TYPESENSE_API_KEY)
      - notContains:
          path: spec.template.spec.containers[0].args
          content: test-literal-key
      - notExists:
          path: spec.template.spec.containers[0].env[1].value

  - it: should not render the literal apiKey anywhere in the container when apiKeySecret.name is set
    set:
      apiKey: test-literal-key
      apiKeySecret.name: typesense-api-key
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env
          value:
            - name: TYPESENSE_DATA_DIR
              value: /data
            - name: TYPESENSE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: typesense-api-key
                  key: api-key
      - equal:
          path: spec.template.spec.containers[0].args
          value:
            - --data-dir
            - /data
            - --api-key
            - $(TYPESENSE_API_KEY)
            - --listen-port
            - "8108"
            - --nodes
            - /etc/typesense/nodes/nodes
            - --reset-peers-on-error
            - --healthy-read-lag
            - "3600"

  - it: should keep the Secret reference with a single replica
    set:
      replicas: 1
      apiKeySecret.name: typesense-api-key
    asserts:
      - equal:
          path: spec.template.spec.containers[0].args
          value:
            - --data-dir
            - /data
            - --api-key
            - $(TYPESENSE_API_KEY)
            - --listen-port
            - "8108"

  - it: should fail when apiKeySecret.name is set without apiKeySecret.key
    set:
      apiKeySecret:
        name: typesense-api-key
        key: ""
    asserts:
      - failedTemplate:
          errorMessage: apiKeySecret.key is required when apiKeySecret.name is set
