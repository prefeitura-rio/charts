suite: custom backend Service names
templates:
  - service.yaml
values:
  - short-names-values.yaml
tests:
  - it: uses the configured PostgreSQL Service name
    documentIndex: 0
    asserts:
      - equal:
          path: metadata.name
          value: postgres
      - equal:
          path: spec.selector["app.kubernetes.io/instance"]
          value: rj-iplanrio-dia-postgres
  - it: uses the configured Danfe Service name
    documentIndex: 1
    asserts:
      - equal:
          path: metadata.name
          value: danfe
      - equal:
          path: spec.selector["app.kubernetes.io/instance"]
          value: rj-sme-danfe-ai-mysql
