suite: multi-instance ConfigMap configuration
templates:
  - deployment.yaml
values:
  - configmap-values.yaml
tests:
  - it: supports independent ConfigMaps per instance
    documentIndex: 0
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CLOUD_SQL_PROJECT_ID
            valueFrom:
              configMapKeyRef:
                name: postgres-config
                key: CLOUD_SQL_PROJECT_ID
      - contains:
          path: spec.template.spec.containers[0].args
          content: "$(CLOUD_SQL_PROJECT_ID):$(CLOUD_SQL_INSTANCE_REGION):$(CLOUD_SQL_INSTANCE_NAME)"
  - it: uses the second instance ConfigMap independently
    documentIndex: 1
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CLOUD_SQL_PROJECT_ID
            valueFrom:
              configMapKeyRef:
                name: danfe-config
                key: CLOUD_SQL_PROJECT_ID
