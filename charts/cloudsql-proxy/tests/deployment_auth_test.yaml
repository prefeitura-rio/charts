suite: shared authentication
templates:
  - deployment.yaml
values:
  - multi-values.yaml
tests:
  - it: reuses one existing ServiceAccount for every instance
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: shared-cloudsql-proxy
      - equal:
          path: spec.template.spec.serviceAccountName
          value: shared-cloudsql-proxy
        documentIndex: 1
      - hasDocuments:
          count: 2
  - it: mounts one existing credential Secret into every instance
    set:
      secret.existingSecret: shared-cloudsql-credentials
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: credentials
            secret:
              secretName: shared-cloudsql-credentials
      - contains:
          path: spec.template.spec.volumes
          content:
            name: credentials
            secret:
              secretName: shared-cloudsql-credentials
        documentIndex: 1
