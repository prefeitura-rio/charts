suite: multi-instance services
templates:
  - service.yaml
values:
  - multi-values.yaml
tests:
  - it: renders one service per instance
    asserts:
      - hasDocuments:
          count: 2
  - it: routes PostgreSQL to only its deployment
    documentIndex: 0
    asserts:
      - equal:
          path: metadata.name
          value: rj-iplanrio-dia-postgres
      - equal:
          path: spec.ports[0].port
          value: 5432
      - equal:
          path: spec.selector["app.kubernetes.io/instance"]
          value: rj-iplanrio-dia-postgres
  - it: routes MySQL to only its deployment
    documentIndex: 1
    asserts:
      - equal:
          path: metadata.name
          value: rj-sme-danfe-ai-mysql
      - equal:
          path: spec.ports[0].port
          value: 3306
      - equal:
          path: spec.selector["app.kubernetes.io/instance"]
          value: rj-sme-danfe-ai-mysql
  - it: applies a Service port override to PostgreSQL
    set:
      service.port: 10000
    documentIndex: 0
    asserts:
      - equal:
          path: spec.ports[0].port
          value: 10000
  - it: applies a Service port override to MySQL
    set:
      service.port: 10000
    documentIndex: 1
    asserts:
      - equal:
          path: spec.ports[0].port
          value: 10000
