suite: multi-instance pod disruption budgets
templates:
  - pdb.yaml
values:
  - multi-values.yaml
tests:
  - it: renders one PDB per instance when enabled
    set:
      podDisruptionBudget.enabled: true
    asserts:
      - hasDocuments:
          count: 2
  - it: selects only the PostgreSQL deployment
    set:
      podDisruptionBudget.enabled: true
    documentIndex: 0
    asserts:
      - equal:
          path: metadata.name
          value: rj-iplanrio-dia-postgres
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/instance"]
          value: rj-iplanrio-dia-postgres
