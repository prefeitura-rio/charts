suite: multi-instance deployments
templates:
  - deployment.yaml
values:
  - multi-values.yaml
tests:
  - it: renders one deployment per instance
    asserts:
      - hasDocuments:
          count: 2
  - it: renders the PostgreSQL deployment independently
    documentIndex: 0
    asserts:
      - equal:
          path: metadata.name
          value: rj-iplanrio-dia-postgres
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--port=5432"
      - contains:
          path: spec.template.spec.containers[0].args
          content: "rj-iplanrio-dia:us-central1:postgres"
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/instance"]
          value: rj-iplanrio-dia-postgres
  - it: renders the MySQL deployment independently
    documentIndex: 1
    asserts:
      - equal:
          path: metadata.name
          value: rj-sme-danfe-ai-mysql
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--port=3306"
      - contains:
          path: spec.template.spec.containers[0].args
          content: "rj-sme-danfe-ai:us-central1:mysql"
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/instance"]
          value: rj-sme-danfe-ai-mysql
  - it: uses independent health ports
    documentIndex: 1
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--http-port=9091"
      - equal:
          path: spec.template.spec.containers[0].ports[1].containerPort
          value: 9091

  - it: truncates long generated names to 63 characters
    values:
      - long-name-values.yaml
    asserts:
      - matchRegex:
          path: metadata.name
          pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9]){0,62}$"
