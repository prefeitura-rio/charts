instances:
  - project: rj-iplanrio-dia
    instance: postgres
    serviceName: postgres
    region: us-central1
    port: 5432
    listenPort: 10000
  - project: rj-sme-danfe-ai
    instance: mysql
    serviceName: danfe
    region: us-central1
    port: 3306
    listenPort: 10001
routing:
  enabled: true
  gateway:
    name: cloudsql-gateway
    namespace: istio-system
    selector:
      app: istio-ingressgateway
      istio: ingressgateway
  tailscale:
    enabled: true
    hostname: cloudsql-proxy
    tags: tag:k8s-iplan
