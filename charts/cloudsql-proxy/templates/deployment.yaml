{{- include "cloudsql-proxy.validateInstances" . }}
{{- range $instance := .Values.instances }}
{{- $ctx := dict "root" $ "instance" $instance }}
{{- $name := include "cloudsql-proxy.instanceName" $ctx }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "cloudsql-proxy.instanceLabels" $ctx | nindent 4 }}
spec:
  replicas: {{ $.Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "cloudsql-proxy.instanceLabels" $ctx | nindent 6 }}
  template:
    metadata:
      {{- with $.Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "cloudsql-proxy.instanceLabels" $ctx | nindent 8 }}
        {{- with $.Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "cloudsql-proxy.serviceAccountName" $ }}
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      containers:
        - name: cloudsql-proxy
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag | default $.Chart.AppVersion }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          args:
            {{- include "cloudsql-proxy.instanceArgs" $ctx | nindent 12 }}
          {{- if include "cloudsql-proxy.useConfigMap" $ctx }}
          {{- $cmName := include "cloudsql-proxy.instanceConfigMapName" $ctx }}
          {{- $keys := include "cloudsql-proxy.instanceConfigMapKeys" $ctx | fromYaml }}
          env:
            - name: {{ $keys.projectId }}
              valueFrom:
                configMapKeyRef:
                  name: {{ $cmName }}
                  key: {{ $keys.projectId }}
            - name: {{ $keys.region }}
              valueFrom:
                configMapKeyRef:
                  name: {{ $cmName }}
                  key: {{ $keys.region }}
            - name: {{ $keys.name }}
              valueFrom:
                configMapKeyRef:
                  name: {{ $cmName }}
                  key: {{ $keys.name }}
          {{- end }}
          ports:
            - name: db
              containerPort: {{ include "cloudsql-proxy.instancePort" $ctx }}
              protocol: TCP
            {{- $health := include "cloudsql-proxy.instanceHealthPort" $ctx | int }}
            {{- if gt $health 0 }}
            - name: http-health
              containerPort: {{ $health }}
              protocol: TCP
            {{- end }}
          {{- if and $.Values.livenessProbe.enabled (gt $health 0) }}
          livenessProbe:
            httpGet:
              path: /liveness
              port: http-health
            initialDelaySeconds: {{ $.Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ $.Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ $.Values.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ $.Values.livenessProbe.failureThreshold }}
          {{- end }}
          {{- if and $.Values.readinessProbe.enabled (gt $health 0) }}
          readinessProbe:
            httpGet:
              path: /readiness
              port: http-health
            initialDelaySeconds: {{ $.Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ $.Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ $.Values.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ $.Values.readinessProbe.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml $.Values.securityContext | nindent 12 }}
          {{- $secretName := include "cloudsql-proxy.secretName" $ }}
          {{- if $secretName }}
          volumeMounts:
            - name: credentials
              mountPath: /var/secrets/google
              readOnly: true
          {{- end }}
      {{- $secretName := include "cloudsql-proxy.secretName" $ }}
      {{- if $secretName }}
      volumes:
        - name: credentials
          secret:
            secretName: {{ $secretName }}
      {{- end }}
      {{- with $.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
{{- end }}
