nameOverride: ""
fullnameOverride: ""

platform: kubernetes

global:
  imageRegistry: ""
  labels:
    kodus.io/environment: ""
    kodus.io/team: ""
    kodus.io/compliance: "soc2"
    kodus.io/data-classification: "confidential"

  existingSecret: ""
  # Bump this value whenever an existing or externally-managed Secret rotates.
  secretVersion: ""
  externalSecrets:
    enabled: false
    store: ""
    storeKind: SecretStore
    refreshInterval: "1h"
    keyPrefix: kodus
  autoGenerateSecrets: true
  secrets:
    API_JWT_SECRET: ""
    API_JWT_REFRESH_SECRET: ""
    WEB_NEXTAUTH_SECRET: ""
    NEXTAUTH_SECRET: ""
    API_CRYPTO_KEY: ""
    CODE_MANAGEMENT_SECRET: ""
    CODE_MANAGEMENT_WEBHOOK_TOKEN: ""
    API_OPEN_AI_API_KEY: ""
    API_MORPHLLM_API_KEY: ""
    API_E2B_KEY: ""
    API_MCP_MANAGER_JWT_SECRET: ""
    API_MCP_MANAGER_ENCRYPTION_SECRET: ""
    API_GITHUB_CLIENT_SECRET: ""
    API_GITHUB_PRIVATE_KEY: ""
    WEB_OAUTH_GITHUB_CLIENT_SECRET: ""

  config:
    WEB_NODE_ENV: "self-hosted"
    WEB_HOSTNAME_API: "{{ .Release.Name }}-api"
    WEB_PORT_API: "3001"
    WEB_PORT: "3000"
    NEXTAUTH_URL: ""
    WEB_SUPPORT_DOCS_URL: "https://docs.kodus.io"
    WEB_SUPPORT_DISCORD_INVITE_URL: "https://discord.gg/QFzwwmNmdN"
    API_NODE_ENV: "production"
    API_LOG_LEVEL: "error"
    API_LOG_PRETTY: "false"
    API_HOST: "0.0.0.0"
    API_PORT: "3001"
    API_RATE_MAX_REQUEST: "100"
    API_RATE_INTERVAL: "1000"
    API_CLOUD_MODE: "false"
    API_JWT_EXPIRES_IN: "1h"
    API_JWT_REFRESH_EXPIRES_IN: "7d"
    API_WEBHOOKS_PORT: "3332"
    API_FRONTEND_URL: "http://{{ .Release.Name }}-web:3000"
    GLOBAL_API_CONTAINER_NAME: "kodus-api"
    API_DATABASE_ENV: "production"
    API_DATABASE_DISABLE_SSL: "false"
    API_RABBITMQ_ENABLED: "true"
    API_RABBITMQ_WAIT: "true"
    RUN_MIGRATIONS: "false"
    RUN_SEEDS: "false"
    SANDBOX_PROVIDER: "local"
    API_AGENT_REVIEW_ENABLED: "true"
    NODE_ENV: "production"
    API_WORKER_DRAIN_TIMEOUT_MS: "60000"
    WORKFLOW_STALE_JOB_REAPER_CRON: "0 */10 * * * *"
    WORKFLOW_STALE_JOB_TIMEOUT_MINUTES: "180"
    API_CRON_SYNC_CODE_REVIEW_REACTIONS: "0 0 * * *"
    API_CRON_KODY_LEARNING: "0 0 * * 6"
    API_CRON_CHECK_IF_PR_SHOULD_BE_APPROVED: "*/2 * * * *"
    API_MCP_SERVER_ENABLED: "true"
    API_KODUS_SERVICE_MCP_MANAGER: "http://{{ .Release.Name }}-mcp-manager:3101"
    API_KODUS_MCP_SERVER_URL: "http://{{ .Release.Name }}-api:3001/mcp"
    WEB_HOSTNAME_MCP_MANAGER: "{{ .Release.Name }}-mcp-manager"
    WEB_PORT_MCP_MANAGER: "3101"
    API_MCP_MANAGER_LOG_LEVEL: "info"
    API_MCP_MANAGER_PORT: "3101"
    API_MCP_MANAGER_NODE_ENV: "production"
    API_MCP_MANAGER_DATABASE_ENV: "production"
    API_MCP_MANAGER_REDIRECT_URI: ""
    API_MCP_MANAGER_CORS_ORIGINS: ""
    API_MCP_MANAGER_MCP_PROVIDERS: "kodusmcp,custom"
    API_MCP_MANAGER_PG_DB_SCHEMA: "mcp-manager"
    API_GITHUB_CODE_MANAGEMENT_WEBHOOK: ""
    API_GITLAB_CODE_MANAGEMENT_WEBHOOK: ""
    GLOBAL_BITBUCKET_CODE_MANAGEMENT_WEBHOOK: ""
    GLOBAL_AZURE_REPOS_CODE_MANAGEMENT_WEBHOOK: ""
    API_FORGEJO_CODE_MANAGEMENT_WEBHOOK: ""

imageTag: "2.1.31"

revisionHistoryLimit: 3

terminationGraceBufferSeconds: 30

image:
  pullPolicy: Always
imagePullSecrets: []

waitForDeps:
  image: busybox:1.37.0

services:
  web:
    enabled: true
    image:
      repository: ghcr.io/kodustech/kodus-ai-web
      tag: ""
    port: 3000
    replicas: 2
    probes:
      path: /api/health
    writablePaths:
      - /usr/src/app/apps/web/.next/cache
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: 500m, memory: 512Mi }

  api:
    enabled: true
    image:
      repository: ghcr.io/kodustech/kodus-ai-api
      tag: ""
    port: 3001
    replicas: 2
    probes:
      path: /health/simple
      readinessPath: /health
    resources:
      requests: { cpu: 250m, memory: 768Mi }
      limits: { cpu: "1", memory: 1536Mi }

  worker:
    enabled: true
    image:
      repository: ghcr.io/kodustech/kodus-ai-worker
      tag: ""
    port: null
    replicas: 2
    env:
      WORKER_ROLE: code-review
      RUN_MIGRATIONS: "false"
    probes:
      path: /health
      port: 3334
    resources:
      requests: { cpu: 250m, memory: 512Mi }
      limits: { cpu: "1", memory: 1536Mi }

  worker-analytics:
    enabled: true
    image:
      repository: ghcr.io/kodustech/kodus-ai-worker
      tag: ""
    port: null
    replicas: 1
    env:
      WORKER_ROLE: analytics
      RUN_MIGRATIONS: "false"
    probes:
      path: /health
      port: 3334
    resources:
      requests: { cpu: 250m, memory: 512Mi }
      limits: { cpu: "1", memory: 1Gi }

  webhooks:
    enabled: true
    image:
      repository: ghcr.io/kodustech/kodus-ai-webhook
      tag: ""
    port: 3332
    replicas: 2
    probes:
      path: /health/live
      readinessPath: /health/ready
    resources:
      requests: { cpu: 100m, memory: 384Mi }
      limits: { cpu: 500m, memory: 768Mi }

  mcp-manager:
    enabled: true
    image:
      repository: ghcr.io/kodustech/kodus-mcp-manager
      tag: ""
    port: 3101
    replicas: 1
    probes:
      path: /health
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: 500m, memory: 512Mi }

migrations:
  enabled: true
  image:
    repository: ghcr.io/kodustech/kodus-ai-api
    tag: ""
  env:
    RUN_MIGRATIONS: "true"
    RUN_SEEDS: "true"

serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  create: false
  rules: []

podSecurityContext:
  fsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  readOnlyRootFilesystem: true

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/hsts: "true"
    nginx.ingress.kubernetes.io/hsts-max-age: "31536000"
    nginx.ingress.kubernetes.io/hsts-include-subdomains: "true"
  tls:
    enabled: true
    secretName: ""
  hosts:
    web:
      enabled: true
      host: kodus.example.com
      path: /
      serviceName: web
    api:
      enabled: true
      host: api.kodus.example.com
      path: /
      serviceName: api
    webhooks:
      enabled: true
      host: webhooks.kodus.example.com
      path: /
      serviceName: webhooks

route:
  enabled: true
  hsts: "max-age=31536000; includeSubDomains"
  annotations: {}
  tls:
    termination: edge
    insecureEdgePolicy: Redirect
  hosts:
    web:
      host: kodus.apps.cluster.example.com
      serviceName: web
    api:
      host: api.kodus.apps.cluster.example.com
      serviceName: api
    webhooks:
      host: webhooks.kodus.apps.cluster.example.com
      serviceName: webhooks

scc:
  create: false
  name: ""

networkPolicy:
  enabled: true
  egressRules: []
  # Restrict ingress to the default nginx controller. Override both selectors
  # when using another ingress implementation.
  ingressControllerLabels:
    app.kubernetes.io/component: controller
    app.kubernetes.io/name: ingress-nginx
  ingressControllerNamespaceSelector:
    kubernetes.io/metadata.name: ingress-nginx
  additionalIngressSources: []

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPU: 80
  targetMemory: null

pdb:
  enabled: true
  minAvailable: 1

resourceQuota:
  enabled: false
  hard:
    requests.cpu: "8"
    requests.memory: "16Gi"
    limits.cpu: "16"
    limits.memory: "32Gi"
    pods: "50"
    persistentvolumeclaims: "10"

postgres:
  mode: bundled
  bundled:
    image: pgvector/pgvector:pg16
    database: kodus_db
    username: kodusdev
    password: ""
    maxConnections: 200
    storage:
      size: 10Gi
      storageClass: ""
    resources:
      requests: { cpu: 250m, memory: 512Mi }
      limits: { cpu: "1", memory: 1Gi }
  external:
    host: ""
    port: 5432
    username: kodusdev
    database: kodus_db
    existingSecret: ""
    passwordKey: password
  operator:
    image: ""
    instances: 2
    database: kodus_db
    owner: kodusdev
    storage:
      size: 10Gi
      storageClass: ""

mongodb:
  mode: bundled
  bundled:
    image: mongo:8
    database: kodus_db
    username: kodusdev
    password: ""
    storage:
      size: 10Gi
      storageClass: ""
    resources:
      requests: { cpu: 100m, memory: 512Mi }
      limits: { cpu: 500m, memory: 1Gi }
  external:
    host: ""
    port: 27017
    username: kodusdev
    database: kodus_db
    existingSecret: ""
    passwordKey: password
  operator:
    version: "8.0.4"
    members: 3
    database: kodus_db
    username: kodusdev
    storage:
      size: 10Gi
      storageClass: ""

rabbitmq:
  mode: bundled
  bundled:
    image: ghcr.io/kodustech/kodus-rabbitmq:4.2.2-kodus
    username: kodus
    password: ""
    storage:
      size: 8Gi
      storageClass: ""
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: 500m, memory: 1Gi }
  external:
    uri: ""
    existingSecret: ""
    uriKey: uri
  operator:
    image: ghcr.io/kodustech/kodus-rabbitmq:4.2.2-kodus
    replicas: 1
    storage:
      size: 8Gi
      storageClass: ""
