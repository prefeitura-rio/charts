{{- if (index .Values.services "webhooks" "enabled" | default true) }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "kodus.fullname" . }}-test-webhooks-health
  labels:
    {{- include "kodus.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  {{- include "kodus-common.imagePullSecrets" . | nindent 2 }}
  securityContext:
    runAsNonRoot: true
    {{- if ne .Values.platform "openshift" }}
    runAsUser: 65534
    {{- end }}
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: check
      image: {{ include "kodus-common.regPrefix" . }}{{ .Values.waitForDeps.image | default "busybox:1.37.0" }}
      command: ["sh", "-c"]
      args:
        - |
          set -e
          url="http://{{ include "kodus-common.serviceFullname" (dict "root" . "serviceName" "webhooks") }}:{{ .Values.services.webhooks.port }}{{ .Values.services.webhooks.probes.readinessPath | default "/health/ready" }}"
          echo "GET $url"
          wget -q -T 10 -O- "$url"
      resources:
        requests: { cpu: 10m, memory: 16Mi }
        limits:   { cpu: 50m, memory: 32Mi }
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
{{- end }}
