{{- if eq .Values.postgres.mode "bundled" }}
{{- $b := .Values.postgres.bundled }}
{{- $name := printf "%s-postgres" .Release.Name }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-init
  labels:
    {{- include "kodus.labels" . | nindent 4 }}
data:
  01-vector.sql: |
    CREATE EXTENSION IF NOT EXISTS vector;
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "kodus.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: postgres
      name: postgres
  selector:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "kodus.labels" . | nindent 4 }}
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/part-of: kodus
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "kodus-common.datastorePodSecurityContext" . | nindent 8 }}
      containers:
        - name: postgres
          image: {{ include "kodus-common.regPrefix" . }}{{ $b.image }}
          imagePullPolicy: {{ .Values.image.pullPolicy | default "Always" }}
          args: ["-c", "max_connections={{ $b.maxConnections }}"]
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: {{ $b.username | quote }}
            - name: POSTGRES_DB
              value: {{ $b.database | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $name }}-secret
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            exec:
              command: ["pg_isready", "-U", {{ $b.username | quote }}, "-d", {{ $b.database | quote }}]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ $b.username | quote }}, "-d", {{ $b.database | quote }}]
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ $b.username | quote }}, "-d", {{ $b.database | quote }}]
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            {{- toYaml $b.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: tmp
              mountPath: /tmp
            - name: runtime
              mountPath: /var/run/postgresql
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 100Mi
        - name: runtime
          emptyDir:
            sizeLimit: 100Mi
        - name: initdb
          configMap:
            name: {{ $name }}-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ $b.storage.size | default "10Gi" }}
        {{- with $b.storage.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
{{- end }}
