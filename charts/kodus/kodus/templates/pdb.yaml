{{- if .Values.pdb.enabled }}
{{- range $name, $svc := .Values.services }}
{{- if or (kindIs "invalid" $svc.enabled) $svc.enabled }}
{{- $floor := 0 }}
{{- if $.Values.autoscaling.enabled }}
{{- $floor = $svc.replicas | default $.Values.autoscaling.minReplicas | default 2 | int }}
{{- else }}
{{- $floor = $svc.replicas | default 1 | int }}
{{- end }}
{{- if gt $floor 1 }}
{{- $min := $.Values.pdb.minAvailable | default 1 }}
{{- if ge ($min | int) $floor }}
{{- fail (printf "ERROR: pdb.minAvailable is %v and service %q has a replica floor of %d, so disruptionsAllowed = %d - %v = 0. That PDB does not slow evictions down, it forbids them permanently, and `kubectl drain` will hang on those pods forever. Set pdb.minAvailable below %d, or raise services.%s.replicas." $min $name $floor $floor $min $floor $name) }}
{{- end }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "kodus-common.serviceFullname" (dict "root" $ "serviceName" $name) }}
  labels:
    {{- include "kodus-common.serviceLabels" (dict "root" $ "serviceName" $name) | nindent 4 }}
spec:
  minAvailable: {{ $.Values.pdb.minAvailable | default 1 }}
  selector:
    matchLabels:
      {{- include "kodus-common.serviceSelectorLabels" (dict "root" $ "serviceName" $name) | nindent 6 }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
