suite: ExternalSecret
templates:
  - templates/externalsecret.yaml
release:
  name: kodus
tests:
  - it: uses the default key prefix
    set:
      global:
        externalSecrets:
          enabled: true
          store: kodus-store
    documentSelector:
      path: metadata.name
      value: kodus-secrets
    asserts:
      - equal:
          path: spec.data[0].remoteRef.key
          value: kodus/API_JWT_SECRET

  - it: uses a configured key prefix
    set:
      global:
        externalSecrets:
          enabled: true
          store: kodus-store
          keyPrefix: kodus-production
    documentSelector:
      path: metadata.name
      value: kodus-secrets
    asserts:
      - equal:
          path: spec.data[0].remoteRef.key
          value: kodus-production/API_JWT_SECRET
