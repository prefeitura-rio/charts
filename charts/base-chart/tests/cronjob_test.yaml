suite: test cronjob
templates:
  - cronjob.yaml
tests:
  - it: should not render when no cronjobs defined
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render when cronjob is disabled
    set:
      cronjobs:
        cleanup:
          enabled: false
          schedule: "0 2 * * *"
    asserts:
      - hasDocuments:
          count: 0

  - it: should render cronjob when enabled
    set:
      cronjobs:
        cleanup:
          enabled: true
          schedule: "0 2 * * *"
          command:
            - /bin/sh
            - -c
            - echo hello
    asserts:
      - isKind:
          of: CronJob
      - equal:
          path: metadata.name
          value: RELEASE-NAME-cleanup
      - equal:
          path: spec.schedule
          value: "0 2 * * *"

  - it: should use default image from deployment
    set:
      image:
        repository: myapp
        tag: "v1.0.0"
      cronjobs:
        cleanup:
          enabled: true
          schedule: "0 2 * * *"
          command:
            - echo
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].image
          value: "myapp:v1.0.0"

  - it: should use custom image when specified
    set:
      cronjobs:
        backup:
          enabled: true
          schedule: "0 5 * * *"
          image:
            repository: postgres
            tag: "15"
          command:
            - pg_dump
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].image
          value: "postgres:15"

  - it: should render multiple cronjobs
    set:
      cronjobs:
        cleanup:
          enabled: true
          schedule: "0 2 * * *"
          command:
            - echo
        backup:
          enabled: true
          schedule: "0 5 * * *"
          command:
            - backup
    asserts:
      - hasDocuments:
          count: 2

  - it: should set concurrencyPolicy
    set:
      cronjobs:
        cleanup:
          enabled: true
          schedule: "0 2 * * *"
          concurrencyPolicy: Replace
          command:
            - echo
    asserts:
      - equal:
          path: spec.concurrencyPolicy
          value: Replace

  - it: should set resource limits
    set:
      cronjobs:
        backup:
          enabled: true
          schedule: "0 5 * * *"
          command:
            - backup
          resources:
            limits:
              cpu: 1
              memory: 2Gi
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].resources.limits.cpu
          value: 1
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].resources.limits.memory
          value: 2Gi

  - it: should include infisical secret in envFrom
    set:
      infisicalSecret:
        enabled: true
        secretName: my-secrets
      cronjobs:
        cleanup:
          enabled: true
          schedule: "0 2 * * *"
          command:
            - echo
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: my-secrets

  - it: should inherit configMap envFrom when mountAsEnv is true
    set:
      configMap:
        enabled: true
        data:
          LOG_LEVEL: "info"
      cronjobs:
        cleanup:
          enabled: true
          schedule: "0 2 * * *"
          command:
            - echo
    asserts:
      - template: cronjob.yaml
        contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].envFrom
          content:
            configMapRef:
              name: RELEASE-NAME

  - it: should default image tag to latest when not set
    set:
      image:
        repository: myorg/app
        tag: ""
      cronjobs:
        cleanup:
          enabled: true
          schedule: "0 2 * * *"
          command: ["echo"]
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].image
          value: "myorg/app:latest"

  - it: should inject REDIS_HOST and REDIS_PORT when valkey is enabled
    set:
      cronjobs:
        cleanup:
          enabled: true
          schedule: "0 2 * * *"
          command: ["echo"]
      valkey:
        enabled: true
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: REDIS_HOST
            value: RELEASE-NAME-valkey
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: REDIS_PORT
            value: "6379"

  - it: should not inject sentinel env vars when valkey sentinel is disabled
    set:
      cronjobs:
        cleanup:
          enabled: true
          schedule: "0 2 * * *"
          command: ["echo"]
      valkey:
        enabled: true
        sentinel:
          enabled: false
    asserts:
      - notContains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: REDIS_USE_SENTINEL
            value: "true"

  - it: should inject REDIS_USE_SENTINEL REDIS_SENTINEL_PORT and REDIS_SENTINEL_MASTER when sentinel is enabled
    set:
      cronjobs:
        cleanup:
          enabled: true
          schedule: "0 2 * * *"
          command: ["echo"]
      valkey:
        enabled: true
        sentinel:
          enabled: true
          port: 26379
          masterName: mymaster
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: REDIS_USE_SENTINEL
            value: "true"
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: REDIS_SENTINEL_PORT
            value: "26379"
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: REDIS_SENTINEL_MASTER
            value: mymaster

  - it: should have hook annotations present
    set:
      cronjobs:
        cleanup:
          enabled: true
          schedule: "0 2 * * *"
          command:
            - /bin/sh
            - -c
            - echo hello
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: "pre-install,pre-upgrade"
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "1"
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: "before-hook-creation"
