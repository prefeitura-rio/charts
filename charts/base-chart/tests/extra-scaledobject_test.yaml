suite: test extra scaledobjects
templates:
  - extra-scaledobject.yaml
tests:
  - it: should render nothing when extraDeployments is empty
    asserts:
      - hasDocuments:
          count: 0

  - it: should render nothing when keda is disabled
    set:
      extraDeployments:
        worker:
          enabled: true
          command: ["echo"]
    asserts:
      - hasDocuments:
          count: 0

  - it: should render ScaledObject when keda is enabled with triggers
    set:
      extraDeployments:
        worker:
          enabled: true
          command: ["echo"]
          keda:
            enabled: true
            triggers:
              - type: rabbitmq
                metadata:
                  queueName: my-queue
                  mode: QueueLength
                  value: "1"
    asserts:
      - isKind:
          of: ScaledObject
      - equal:
          path: metadata.name
          value: RELEASE-NAME-worker

  - it: should point scaleTargetRef to the correct deployment
    set:
      extraDeployments:
        worker:
          enabled: true
          command: ["echo"]
          keda:
            enabled: true
            triggers:
              - type: rabbitmq
                metadata:
                  queueName: q
                  mode: QueueLength
                  value: "1"
    asserts:
      - equal:
          path: spec.scaleTargetRef.name
          value: RELEASE-NAME-worker

  - it: should default minReplicaCount to 0 and maxReplicaCount to 5
    set:
      extraDeployments:
        worker:
          enabled: true
          command: ["echo"]
          keda:
            enabled: true
            triggers:
              - type: rabbitmq
                metadata:
                  queueName: q
                  mode: QueueLength
                  value: "1"
    asserts:
      - equal:
          path: spec.minReplicaCount
          value: 0
      - equal:
          path: spec.maxReplicaCount
          value: 5

  - it: should use custom replica counts
    set:
      extraDeployments:
        worker:
          enabled: true
          command: ["echo"]
          keda:
            enabled: true
            minReplicaCount: 2
            maxReplicaCount: 10
            triggers:
              - type: rabbitmq
                metadata:
                  queueName: q
                  mode: QueueLength
                  value: "1"
    asserts:
      - equal:
          path: spec.minReplicaCount
          value: 2
      - equal:
          path: spec.maxReplicaCount
          value: 10

  - it: should pass through trigger metadata
    set:
      extraDeployments:
        worker:
          enabled: true
          command: ["echo"]
          keda:
            enabled: true
            triggers:
              - type: rabbitmq
                metadata:
                  queueName: sync:cnpj:shards
                  mode: QueueLength
                  value: "1"
    asserts:
      - equal:
          path: spec.triggers[0].type
          value: rabbitmq
      - equal:
          path: spec.triggers[0].metadata.queueName
          value: sync:cnpj:shards
      - equal:
          path: spec.triggers[0].metadata.mode
          value: QueueLength
      - equal:
          path: spec.triggers[0].metadata.value
          value: "1"
