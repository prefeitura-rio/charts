suite: test scaledjobs
templates:
  - scaledjob.yaml
tests:
  - it: should render nothing when scaledJobs is empty
    asserts:
      - hasDocuments:
          count: 0

  - it: should render nothing when entry is disabled
    set:
      autoscaling:
        keda:
          scaledJobs:
            sync-consumer:
              enabled: false
              command: ["echo"]
              triggers: []
    asserts:
      - hasDocuments:
          count: 0

  - it: should render ScaledJob for enabled entry
    set:
      autoscaling:
        keda:
          scaledJobs:
            sync-consumer:
              enabled: true
              command:
                - faststream
                - run
                - app.sync.consumer:consumer
              triggers:
                - type: rabbitmq
                  metadata:
                    queueName: sync:cnpj:shards
                    mode: QueueLength
                    value: "1"
    asserts:
      - isKind:
          of: ScaledJob
      - equal:
          path: apiVersion
          value: keda.sh/v1alpha1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-sync-consumer

  - it: should set component label to job name
    set:
      autoscaling:
        keda:
          scaledJobs:
            worker:
              enabled: true
              command: ["echo"]
              triggers: []
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: worker
      - equal:
          path: spec.jobTargetRef.template.metadata.labels["app.kubernetes.io/component"]
          value: worker

  - it: should always have parallelism and completions of 1
    set:
      autoscaling:
        keda:
          scaledJobs:
            worker:
              enabled: true
              command: ["echo"]
              triggers: []
    asserts:
      - equal:
          path: spec.jobTargetRef.parallelism
          value: 1
      - equal:
          path: spec.jobTargetRef.completions
          value: 1

  - it: should default activeDeadlineSeconds to 3600
    set:
      autoscaling:
        keda:
          scaledJobs:
            worker:
              enabled: true
              command: ["echo"]
              triggers: []
    asserts:
      - equal:
          path: spec.jobTargetRef.activeDeadlineSeconds
          value: 3600

  - it: should default backoffLimit to 3
    set:
      autoscaling:
        keda:
          scaledJobs:
            worker:
              enabled: true
              command: ["echo"]
              triggers: []
    asserts:
      - equal:
          path: spec.jobTargetRef.backoffLimit
          value: 3

  - it: should use custom activeDeadlineSeconds and backoffLimit
    set:
      autoscaling:
        keda:
          scaledJobs:
            worker:
              enabled: true
              command: ["echo"]
              triggers: []
              activeDeadlineSeconds: 600
              backoffLimit: 1
    asserts:
      - equal:
          path: spec.jobTargetRef.activeDeadlineSeconds
          value: 600
      - equal:
          path: spec.jobTargetRef.backoffLimit
          value: 1

  - it: should always have restartPolicy Never
    set:
      autoscaling:
        keda:
          scaledJobs:
            worker:
              enabled: true
              command: ["echo"]
              triggers: []
    asserts:
      - equal:
          path: spec.jobTargetRef.template.spec.restartPolicy
          value: Never

  - it: should use main image
    set:
      image:
        repository: my-app
        tag: "3.0.0"
      autoscaling:
        keda:
          scaledJobs:
            worker:
              enabled: true
              command: ["echo"]
              triggers: []
    asserts:
      - equal:
          path: spec.jobTargetRef.template.spec.containers[0].image
          value: "my-app:3.0.0"

  - it: should inherit envFrom from root values
    set:
      envFrom:
        - secretRef:
            name: my-secrets
      autoscaling:
        keda:
          scaledJobs:
            worker:
              enabled: true
              command: ["echo"]
              triggers: []
    asserts:
      - contains:
          path: spec.jobTargetRef.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: my-secrets

  - it: should default minReplicaCount to 0 and maxReplicaCount to 10
    set:
      autoscaling:
        keda:
          scaledJobs:
            worker:
              enabled: true
              command: ["echo"]
              triggers: []
    asserts:
      - equal:
          path: spec.minReplicaCount
          value: 0
      - equal:
          path: spec.maxReplicaCount
          value: 10

  - it: should use custom maxReplicaCount
    set:
      autoscaling:
        keda:
          scaledJobs:
            worker:
              enabled: true
              command: ["echo"]
              triggers: []
              maxReplicaCount: 20
    asserts:
      - equal:
          path: spec.maxReplicaCount
          value: 20

  - it: should default pollingInterval to 30
    set:
      autoscaling:
        keda:
          scaledJobs:
            worker:
              enabled: true
              command: ["echo"]
              triggers: []
    asserts:
      - equal:
          path: spec.pollingInterval
          value: 30

  - it: should always use accurate scalingStrategy
    set:
      autoscaling:
        keda:
          scaledJobs:
            worker:
              enabled: true
              command: ["echo"]
              triggers: []
    asserts:
      - equal:
          path: spec.scalingStrategy.strategy
          value: accurate

  - it: should pass through trigger metadata
    set:
      autoscaling:
        keda:
          scaledJobs:
            sync-consumer:
              enabled: true
              command: ["faststream", "run", "app:consumer"]
              triggers:
                - type: rabbitmq
                  metadata:
                    queueName: sync:cnpj:shards
                    mode: QueueLength
                    value: "1"
                - type: rabbitmq
                  metadata:
                    queueName: sync:cpf:shards
                    mode: QueueLength
                    value: "1"
    asserts:
      - equal:
          path: spec.triggers[0].type
          value: rabbitmq
      - equal:
          path: spec.triggers[0].metadata.queueName
          value: sync:cnpj:shards
      - equal:
          path: spec.triggers[1].metadata.queueName
          value: sync:cpf:shards

  - it: should render multiple ScaledJobs for multiple entries
    set:
      autoscaling:
        keda:
          scaledJobs:
            cnpj-consumer:
              enabled: true
              command: ["echo", "cnpj"]
              triggers: []
            cpf-consumer:
              enabled: true
              command: ["echo", "cpf"]
              triggers: []
    asserts:
      - hasDocuments:
          count: 2
