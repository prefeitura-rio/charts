suite: test infisicalstaticsecret
templates:
  - infisicalstaticsecret.yaml
tests:
  - it: should not render when disabled
    set:
      infisicalStaticSecret.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should render with required fields
    set:
      infisicalStaticSecret:
        enabled: true
        secretName: my-app-secrets
        projectSlug: my-project
        envSlug: prod
        infisicalAuthRef:
          name: infisical
          namespace: infisical
    asserts:
      - isKind:
          of: InfisicalStaticSecret
      - equal:
          path: apiVersion
          value: secrets.infisical.com/v1beta1
      - equal:
          path: metadata.name
          value: my-app-secrets
      - equal:
          path: spec.infisicalAuthRef
          value:
            name: infisical
            namespace: infisical
      - equal:
          path: spec.sources[0]
          value:
            projectSlug: my-project
            environmentSlug: prod
            secretPath: /
            recursive: true
      - equal:
          path: spec.targets[0]
          value:
            name: my-app-secrets
            namespace: NAMESPACE
            kind: Secret
            creationPolicy: Orphan
      - equal:
          path: spec.syncOptions.refreshInterval
          value: 60s

  - it: should not set a template on the main target, so every secret is included
    set:
      infisicalStaticSecret:
        enabled: true
        secretName: my-app-secrets
        projectSlug: my-project
        envSlug: prod
        infisicalAuthRef:
          name: infisical
          namespace: infisical
    asserts:
      - isNull:
          path: spec.targets[0].template

  - it: should respect a custom path, a custom namespace and no recursion
    set:
      infisicalStaticSecret:
        enabled: true
        secretName: my-app-secrets
        projectSlug: my-project
        envSlug: staging
        secretsPath: /app
        recursive: false
        creationPolicy: Owner
        managedSecretNamespace: other
        infisicalAuthRef:
          name: infisical
          namespace: infisical
    asserts:
      - equal:
          path: spec.sources[0].secretPath
          value: /app
      - equal:
          path: spec.sources[0].recursive
          value: false
      - equal:
          path: spec.targets[0].namespace
          value: other
      - equal:
          path: spec.targets[0].creationPolicy
          value: Owner

  - it: should create a derived RabbitMQ URL target with the v1 template
    set:
      infisicalStaticSecret:
        enabled: true
        secretName: my-app-secrets
        projectSlug: my-project
        envSlug: prod
        infisicalAuthRef:
          name: infisical
          namespace: infisical
      rabbitmq.enabled: true
      rabbitmq.auth.username: app-user
      rabbitmq.auth.existingSecret: my-app-secrets
      rabbitmq.auth.existingPasswordKey: RABBITMQ_PASSWORD
    asserts:
      - equal:
          path: spec.targets[1].name
          value: RELEASE-NAME-rabbitmq-url
      - equal:
          path: spec.targets[1].template.engineVersion
          value: v1
      - equal:
          path: spec.targets[1].template.data.RABBITMQ_URL
          value: "amqp://app-user:{{ .RABBITMQ_PASSWORD.Value | urlquery }}@RELEASE-NAME-rabbitmq.NAMESPACE.svc.cluster.local:5672/"

  - it: should not create a derived RabbitMQ URL target without an existing secret
    set:
      infisicalStaticSecret:
        enabled: true
        secretName: my-app-secrets
        projectSlug: my-project
        envSlug: prod
        infisicalAuthRef:
          name: infisical
          namespace: infisical
      rabbitmq.enabled: true
    asserts:
      - isNull:
          path: spec.targets[1]

  - it: should fail without the secret name
    set:
      infisicalStaticSecret:
        enabled: true
        projectSlug: my-project
        envSlug: prod
        infisicalAuthRef:
          name: infisical
          namespace: infisical
    asserts:
      - failedTemplate:
          errorMessage: "infisicalStaticSecret.secretName is required when infisicalStaticSecret.enabled is true"

  - it: should use the old instance by default
    set:
      infisicalStaticSecret:
        enabled: true
        secretName: my-app-secrets
        projectSlug: my-project
        envSlug: prod
    asserts:
      - equal:
          path: spec.infisicalAuthRef
          value:
            name: infisical
            namespace: infisical

  - it: should use the auth of the chosen instance
    set:
      infisical.instance: secrets
      infisicalStaticSecret:
        enabled: true
        secretName: my-app-secrets
        projectSlug: my-project
        envSlug: prod
    asserts:
      - equal:
          path: spec.infisicalAuthRef
          value:
            name: secrets
            namespace: infisical

  - it: should prefer an explicit auth reference over the instance
    set:
      infisical.instance: secrets
      infisicalStaticSecret:
        enabled: true
        secretName: my-app-secrets
        projectSlug: my-project
        envSlug: prod
        infisicalAuthRef:
          name: custom
          namespace: custom-ns
    asserts:
      - equal:
          path: spec.infisicalAuthRef
          value:
            name: custom
            namespace: custom-ns

  - it: should fail for an unknown instance
    set:
      infisical.instance: nope
      infisicalStaticSecret:
        enabled: true
        secretName: my-app-secrets
        projectSlug: my-project
        envSlug: prod
    asserts:
      - failedTemplate:
          errorMessage: "infisical.instance must be one of the keys of infisical.instances"

  - it: should fail when both Infisical CRDs are enabled
    set:
      infisicalSecret:
        enabled: true
        secretName: a
        projectSlug: p
        envSlug: prod
      infisicalStaticSecret:
        enabled: true
        secretName: a
        projectSlug: p
        envSlug: prod
        infisicalAuthRef:
          name: infisical
          namespace: infisical
    asserts:
      - failedTemplate:
          errorMessage: "infisicalSecret and infisicalStaticSecret cannot both be enabled"
