{{- if and .Values.infisicalSecret.enabled .Values.infisicalStaticSecret.enabled }}
{{- fail "infisicalSecret and infisicalStaticSecret cannot both be enabled" }}
{{- end }}
{{- if .Values.infisicalStaticSecret.enabled }}
{{- $secretName := .Values.infisicalStaticSecret.secretName | required "infisicalStaticSecret.secretName is required when infisicalStaticSecret.enabled is true" }}
{{- $secretNamespace := .Values.infisicalStaticSecret.managedSecretNamespace | default .Release.Namespace }}
{{- $creationPolicy := .Values.infisicalStaticSecret.creationPolicy | default "Orphan" }}
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: {{ $secretName }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-2"
    "helm.sh/hook-delete-policy": before-hook-creation
  labels:
    {{- include "base-chart.labels" . | nindent 4 }}
spec:
  infisicalAuthRef:
    name: {{ .Values.infisicalStaticSecret.infisicalAuthRef.name | required "infisicalStaticSecret.infisicalAuthRef.name is required" }}
    namespace: {{ .Values.infisicalStaticSecret.infisicalAuthRef.namespace | required "infisicalStaticSecret.infisicalAuthRef.namespace is required" }}
  syncOptions:
    refreshInterval: {{ .Values.infisicalStaticSecret.refreshInterval | default "60s" | quote }}
  sources:
    - projectSlug: {{ .Values.infisicalStaticSecret.projectSlug | required "infisicalStaticSecret.projectSlug is required" }}
      environmentSlug: {{ .Values.infisicalStaticSecret.envSlug | required "infisicalStaticSecret.envSlug is required" }}
      secretPath: {{ .Values.infisicalStaticSecret.secretsPath | default "/" | quote }}
      recursive: {{ .Values.infisicalStaticSecret.recursive }}
  targets:
    - name: {{ $secretName }}
      namespace: {{ $secretNamespace }}
      kind: Secret
      creationPolicy: {{ $creationPolicy }}
    {{- if and .Values.rabbitmq.enabled .Values.rabbitmq.auth.existingSecret }}
    - name: {{ include "base-chart.fullname" . }}-rabbitmq-url
      namespace: {{ $secretNamespace }}
      kind: Secret
      creationPolicy: {{ $creationPolicy }}
      template:
        engineVersion: v1
        data:
          RABBITMQ_URL: {{ printf "amqp://%s:{{ .%s.Value | urlquery }}@%s-rabbitmq.%s.svc.cluster.local:%v/" (.Values.rabbitmq.auth.username | default .Release.Name) (.Values.rabbitmq.auth.existingPasswordKey | default "password") .Release.Name .Release.Namespace .Values.rabbitmq.service.amqpPort | quote }}
    {{- end }}
{{- end }}
