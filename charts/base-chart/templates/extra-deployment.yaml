{{- range $name, $spec := .Values.extraDeployments }}
{{- if $spec.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "base-chart.fullname" $ }}-{{ $name }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation
  labels:
    {{- include "base-chart.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  replicas: {{ $spec.replicaCount | default 1 }}
  {{- if $.Values.revisionHistoryLimit }}
  revisionHistoryLimit: {{ $.Values.revisionHistoryLimit }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "base-chart.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ $name }}
  template:
    metadata:
      labels:
        {{- include "base-chart.labels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $name }}
    spec:
      imagePullSecrets:
        {{- include "base-chart.imagePullSecrets" $ | nindent 8 }}
      serviceAccountName: {{ include "base-chart.serviceAccountName" $ }}
      containers:
        - name: {{ $name }}
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command: {{ $spec.command | toYaml | nindent 12 }}
          {{- with $spec.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- else }}
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
          {{- end }}
          {{- if or $spec.env $.Values.valkey.enabled }}
          env:
            {{- with $spec.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- if $.Values.valkey.enabled }}
            - name: REDIS_HOST
              value: {{ $.Release.Name }}-valkey
            - name: REDIS_PORT
              value: "6379"
            {{- if $.Values.valkey.sentinel.enabled }}
            - name: REDIS_USE_SENTINEL
              value: "true"
            - name: REDIS_SENTINEL_PORT
              value: {{ $.Values.valkey.sentinel.port | default 26379 | quote }}
            - name: REDIS_SENTINEL_MASTER
              value: {{ $.Values.valkey.sentinel.masterName | default "mymaster" }}
            {{- end }}
            {{- end }}
          {{- end }}
          envFrom:
            {{- $.Values.envFrom | toYaml | nindent 12 }}
          {{- with $.Values.healthCheck }}
          {{- if .path }}
          livenessProbe:
            httpGet:
              path: {{ .path }}
              port: {{ $.Values.service.containerPort }}
            initialDelaySeconds: {{ .initialDelaySeconds | default 15 }}
            periodSeconds: {{ .periodSeconds | default 10 }}
          readinessProbe:
            httpGet:
              path: {{ .path }}
              port: {{ $.Values.service.containerPort }}
            initialDelaySeconds: {{ .initialDelaySeconds | default 15 }}
            periodSeconds: {{ .periodSeconds | default 10 }}
          {{- end }}
          {{- end }}
{{- end }}
{{- end }}
