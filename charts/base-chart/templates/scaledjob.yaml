{{- range $name, $spec := .Values.autoscaling.keda.scaledJobs }}
{{- if $spec.enabled }}
---
apiVersion: keda.sh/v1alpha1
kind: ScaledJob
metadata:
  name: {{ include "base-chart.fullname" $ }}-{{ $name }}
  labels:
    {{- include "base-chart.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  jobTargetRef:
    parallelism: 1
    completions: 1
    activeDeadlineSeconds: {{ $spec.activeDeadlineSeconds | default 3600 }}
    backoffLimit: {{ $spec.backoffLimit | default 3 }}
    template:
      metadata:
        labels:
          {{- include "base-chart.selectorLabels" $ | nindent 10 }}
          app.kubernetes.io/component: {{ $name }}
      spec:
        restartPolicy: Never
        imagePullSecrets:
          {{- include "base-chart.imagePullSecrets" $ | nindent 10 }}
        serviceAccountName: {{ include "base-chart.serviceAccountName" $ }}
        containers:
          - name: {{ $name }}
            image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag }}"
            imagePullPolicy: {{ $.Values.image.pullPolicy }}
            command: {{ $spec.command | toYaml | nindent 14 }}
            {{- with $spec.resources | default $.Values.resources }}
            resources:
              {{- toYaml . | nindent 14 }}
            {{- end }}
            {{- if or $spec.env $.Values.valkey.enabled }}
            env:
              {{- with $spec.env }}
              {{- toYaml . | nindent 14 }}
              {{- end }}
              {{- if $.Values.valkey.enabled }}
              - name: REDIS_HOST
                value: {{ $.Release.Name }}-valkey
              - name: REDIS_PORT
                value: "6379"
              {{- if $.Values.valkey.sentinel.enabled }}
              - name: REDIS_USE_SENTINEL
                value: "true"
              - name: REDIS_SENTINEL_PORT
                value: {{ $.Values.valkey.sentinel.port | default 26379 | quote }}
              - name: REDIS_SENTINEL_MASTER
                value: {{ $.Values.valkey.sentinel.masterName | default "mymaster" }}
              {{- end }}
              {{- end }}
            {{- end }}
            envFrom:
              {{- $.Values.envFrom | toYaml | nindent 14 }}
  pollingInterval: {{ $spec.pollingInterval | default 30 }}
  minReplicaCount: 0
  maxReplicaCount: {{ $spec.maxReplicaCount | default 10 }}
  scalingStrategy:
    strategy: accurate
  triggers:
    {{- range $spec.triggers }}
    - type: {{ .type }}
      {{- if $.Values.autoscaling.keda.triggerAuthentication }}
      authenticationRef:
        name: {{ $.Values.autoscaling.keda.triggerAuthentication.name | default (printf "%s-trigger-auth" (include "base-chart.fullname" $)) }}
      {{- end }}
      metadata:
        {{- toYaml .metadata | nindent 8 }}
    {{- end }}
{{- end }}
{{- end }}
